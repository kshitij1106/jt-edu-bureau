<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My account — JT Education Bureau</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="site-header-mount"></div>

<main id="app" style="display:none;">
  <section class="section" style="padding-bottom:10px;">
    <div class="container">
      <div class="dash-header">
        <div>
          <h1 style="font-size:clamp(1.7rem,3vw,2.2rem);">Welcome, <span id="welcomeName">—</span></h1>
          <p class="dash-sub">Submit a new request any time, or check the status of ones you've already sent.</p>
        </div>
        <button class="btn btn-outline" id="logoutBtn">Log out</button>
      </div>
    </div>
  </section>

  <section class="section" style="padding-top:16px;">
    <div class="container" style="display:grid; grid-template-columns:1fr 1.15fr; gap:32px; align-items:flex-start;">

      <div class="form-panel">
        <span class="form-no">FORM NO. JT-R &middot; NEW REQUEST</span>
        <h3 style="margin-top:6px;">Request a tutor</h3>
        <hr class="ledger-rule" style="margin:18px 0 22px;">
        <form id="requestForm" novalidate>
          <div class="field">
            <label for="rSubject">Subject(s) needed <span class="req">*</span></label>
            <input type="text" id="rSubject" required placeholder="e.g. Mathematics, Physics">
          </div>
          <div class="field-row">
            <div class="field">
              <label for="rClass">Class</label>
              <select id="rClass">
                <option value="">Select class</option>
                <option>Nursery–5</option><option>6</option><option>7</option><option>8</option>
                <option>9</option><option>10</option><option>11</option><option>12</option>
                <option>Competitive exam aspirant</option><option>College / other</option>
              </select>
            </div>
            <div class="field">
              <label for="rBoard">Board</label>
              <select id="rBoard">
                <option value="">Select board</option>
                <option>CBSE</option><option>ICSE</option><option>IB</option>
                <option>State board</option><option>Not applicable</option>
              </select>
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label for="rMode">Preferred mode <span class="req">*</span></label>
              <select id="rMode" required>
                <option value="">Select mode</option>
                <option>Home visit</option><option>Online</option><option>Either</option>
              </select>
            </div>
            <div class="field">
              <label for="rLocality">Locality <span class="req">*</span></label>
              <input type="text" id="rLocality" required placeholder="e.g. Lajpat Nagar">
            </div>
          </div>
          <div class="field">
            <label for="rNotes">Anything else</label>
            <textarea id="rNotes" rows="3" placeholder="Preferred timing, exam goals, a specific tutor you liked, etc."></textarea>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Submit request</button>
        </form>
      </div>

      <div>
        <h3 style="margin-bottom:14px;">Your requests</h3>
        <div id="historyList"><p class="portal-loading">Loading…</p></div>

        <div class="form-panel" style="margin-top:28px;">
          <h3 style="margin-top:0;">Your details</h3>
          <form id="profileForm" novalidate>
            <div class="field">
              <label for="pName">Name</label>
              <input type="text" id="pName">
            </div>
            <div class="field">
              <label for="pEmail">Email</label>
              <input type="email" id="pEmail">
            </div>
            <button type="submit" class="btn btn-outline">Save</button>
            <span id="profileSaved" style="font-size:0.82rem; color:var(--success); margin-left:10px; display:none;">Saved</span>
          </form>
        </div>
      </div>

    </div>
  </section>
</main>

<div id="loadingScreen" class="portal-shell"><p class="portal-loading">Loading your account…</p></div>

<div id="site-footer-mount"></div>

<script src="js/jt-data.js"></script>
<script src="js/site.js"></script>
<script>
  jtRenderHeader("");
  jtRenderFooter();

  let SESSION;

  function statusPill(status) {
    const s = (status || "New").toLowerCase();
    const cls = s === "matched" ? "pill-verified" : s === "closed" ? "pill-rejected" : "pill-pending";
    return `<span class="pill ${cls}"><span class="dot"></span>${status || "New"}</span>`;
  }

  async function loadHistory() {
    const res = await jtApiCall("getMyRequests", { token: SESSION.token });
    const list = document.getElementById("historyList");
    if (!res.ok || !res.requests.length) {
      list.innerHTML = `<p style="color:var(--ink-soft); font-size:0.88rem;">No requests yet — submit one alongside.</p>`;
      return;
    }
    list.innerHTML = res.requests.map(r => `
      <div class="history-item">
        <div>
          <h4>${r.Subject || "Tutor request"}</h4>
          <div class="meta">${[r.Class, r.Board, r.Locality, r.Mode].filter(Boolean).join(" · ")}</div>
        </div>
        <div style="text-align:right;">
          ${statusPill(r.Status)}
          <div class="when">${r.Timestamp ? new Date(r.Timestamp).toLocaleDateString() : ""}</div>
        </div>
      </div>`).join("");
  }

  document.getElementById("requestForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector("button");
    btn.disabled = true; btn.textContent = "Submitting…";
    const res = await jtApiCall("submitRequest", {
      token: SESSION.token,
      data: {
        Subject: document.getElementById("rSubject").value,
        Class: document.getElementById("rClass").value,
        Board: document.getElementById("rBoard").value,
        Mode: document.getElementById("rMode").value,
        Locality: document.getElementById("rLocality").value,
        Notes: document.getElementById("rNotes").value
      }
    });
    btn.disabled = false; btn.textContent = "Submit request";
    if (res.ok) {
      e.target.reset();
      loadHistory();
    } else {
      alert("Couldn't submit — please try again in a moment.");
    }
  });

  document.getElementById("profileForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const res = await jtApiCall("updateProfile", {
      token: SESSION.token,
      data: { Name: document.getElementById("pName").value, Email: document.getElementById("pEmail").value }
    });
    if (res.ok) {
      document.getElementById("welcomeName").textContent = document.getElementById("pName").value || "there";
      const saved = document.getElementById("profileSaved");
      saved.style.display = "inline"; setTimeout(() => saved.style.display = "none", 2000);
    }
  });

  document.getElementById("logoutBtn").addEventListener("click", async () => {
    await jtApiCall("logout", { token: SESSION.token });
    jtClearSession();
    location.href = "find-a-tutor.html";
  });

  (async () => {
    const auth = await jtRequireAuth("student", "find-a-tutor.html");
    if (!auth) return;
    SESSION = auth;
    document.getElementById("welcomeName").textContent = auth.profile.Name || "there";
    document.getElementById("pName").value = auth.profile.Name || "";
    document.getElementById("pEmail").value = auth.profile.Email || "";
    document.getElementById("loadingScreen").style.display = "none";
    document.getElementById("app").style.display = "";
    loadHistory();

    const params = new URLSearchParams(location.search);
    if (params.get("subject")) document.getElementById("rSubject").value = params.get("subject");
    if (params.get("tutor")) document.getElementById("rNotes").value = `Interested in: ${params.get("tutor")}`;
  })();
</script>
</body>
</html>
