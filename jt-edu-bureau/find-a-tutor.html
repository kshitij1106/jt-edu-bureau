<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student &amp; parent login — JT Education Bureau</title>
<meta name="description" content="Log in or register to browse verified tutors from JT Education Bureau.">
<link rel="icon" type="image/png" href="assets/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="site-header-mount"></div>

<main>
  <div class="portal-shell">
    <div class="portal-narrow">
      <div class="form-panel">
        <span class="form-no">STUDENT &amp; PARENT ACCOUNT</span>
        <h3 style="margin-top:6px;">Student &amp; Parent Login</h3>
        <p style="color:var(--ink-soft); font-size:0.88rem; margin-bottom:20px;">One login lets you submit requests for as many subjects or tutors as you need, and see their status any time.</p>

        <div class="auth-tabs">
          <button class="auth-tab active" id="tabLogin">Log in</button>
          <button class="auth-tab" id="tabRegister">Register</button>
        </div>

        <div class="auth-error" id="authError"></div>

        <form id="loginForm" novalidate>
          <div class="field">
            <label for="lPhone">Phone number <span class="req">*</span></label>
            <input type="tel" id="lPhone" required placeholder="10-digit mobile number">
          </div>
          <div class="field">
            <label for="lPassword">Password <span class="req">*</span></label>
            <input type="password" id="lPassword" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Log in</button>
        </form>

        <form id="registerForm" novalidate style="display:none;">
          <div class="field">
            <label for="rName">Your name <span class="req">*</span></label>
            <input type="text" id="rName" required>
          </div>
          <div class="field-row">
            <div class="field">
              <label for="rPhone">Phone number <span class="req">*</span></label>
              <input type="tel" id="rPhone" required placeholder="10-digit mobile number">
            </div>
            <div class="field">
              <label for="rEmail">Email</label>
              <input type="email" id="rEmail" placeholder="optional">
            </div>
          </div>
          <div class="field">
            <label for="rPassword">Create a password <span class="req">*</span></label>
            <input type="password" id="rPassword" required minlength="6">
            <span class="field-error" style="display:block; color:var(--ink-soft); font-size:0.78rem; margin-top:5px;">At least 6 characters.</span>
          </div>

          <hr class="ledger-rule" style="margin:20px 0;">
          <p style="color:var(--ink-soft); font-size:0.84rem; margin-bottom:14px;">A few details about what you're looking for, saved to your profile.</p>

          <div class="field-row">
            <div class="field">
              <label for="rClass">Class <span class="req">*</span></label>
              <select id="rClass" required>
                <option value="">Select</option>
                <option>Nursery–5</option><option>6</option><option>7</option><option>8</option>
                <option>9</option><option>10</option><option>11</option><option>12</option>
                <option>Competitive exam aspirant</option><option>College / other</option>
              </select>
            </div>
            <div class="field">
              <label for="rBoard">Board</label>
              <select id="rBoard">
                <option value="">Select</option>
                <option>CBSE</option><option>ICSE</option><option>IB</option>
                <option>State board</option><option>Not applicable</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="rLocality">Area <span class="req">*</span></label>
            <input type="text" id="rLocality" required placeholder="Your approximate location">
          </div>

          <button type="submit" class="btn btn-primary btn-block">Create account</button>
        </form>
      </div>
    </div>
  </div>
</main>

<div id="site-footer-mount"></div>

<script src="js/jt-data.js"></script>
<script src="js/site.js"></script>
<script>
  jtRenderHeader("find-a-tutor.html");
  jtRenderFooter();

  // already logged in? skip straight to the dashboard
  const existing = jtGetSession();
  if (existing && existing.role === "student") location.href = "student-dashboard.html" + location.search;

  const tabLogin = document.getElementById("tabLogin");
  const tabRegister = document.getElementById("tabRegister");
  const loginForm = document.getElementById("loginForm");
  const registerForm = document.getElementById("registerForm");
  const errorBox = document.getElementById("authError");

  function showError(msg) { errorBox.textContent = msg; errorBox.classList.add("show"); }
  function clearError() { errorBox.classList.remove("show"); }

  tabLogin.addEventListener("click", () => {
    tabLogin.classList.add("active"); tabRegister.classList.remove("active");
    loginForm.style.display = ""; registerForm.style.display = "none"; clearError();
  });
  tabRegister.addEventListener("click", () => {
    tabRegister.classList.add("active"); tabLogin.classList.remove("active");
    registerForm.style.display = ""; loginForm.style.display = "none"; clearError();
  });

  const REASONS = {
    invalid_phone: "Enter a valid 10-digit phone number.",
    weak_password: "Password needs to be at least 6 characters.",
    phone_exists: "An account with this phone number already exists — try logging in instead.",
    invalid_credentials: "That phone number or password doesn't match our records.",
    too_many_attempts: "Too many attempts — please wait 15 minutes and try again.",
    not_configured: "The account system isn't connected yet. See apps-script/README.md.",
    network: "Couldn't reach the server — check your connection and try again."
  };

  loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    clearError();
    const btn = loginForm.querySelector("button");
    btn.disabled = true; btn.textContent = "Logging in…";
    const res = await jtApiCall("login", {
      role: "student",
      phone: document.getElementById("lPhone").value,
      password: document.getElementById("lPassword").value
    });
    btn.disabled = false; btn.textContent = "Log in";
    if (res.ok) {
      jtSaveSession(res.token, "student");
      location.href = "student-dashboard.html" + location.search;
    } else {
      showError(REASONS[res.reason] || "Something went wrong — please try again.");
    }
  });

  registerForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    clearError();
    const btn = registerForm.querySelector("button");
    btn.disabled = true; btn.textContent = "Creating account…";
    const res = await jtApiCall("register", {
      role: "student",
      name: document.getElementById("rName").value,
      phone: document.getElementById("rPhone").value,
      email: document.getElementById("rEmail").value,
      password: document.getElementById("rPassword").value,
      studentClass: document.getElementById("rClass").value,
      board: document.getElementById("rBoard").value,
      locality: document.getElementById("rLocality").value
    });
    btn.disabled = false; btn.textContent = "Create account";
    if (res.ok) {
      jtSaveSession(res.token, "student");
      location.href = "student-dashboard.html" + location.search;
    } else {
      showError(REASONS[res.reason] || "Something went wrong — please try again.");
    }
  });
</script>
</body>
</html>
