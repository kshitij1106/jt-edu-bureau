<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tutor login — JT Education Bureau</title>
<meta name="description" content="Log in or register as a tutor with JT Education Bureau — manage your own profile, rates and availability.">
<link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="site-header-mount"></div>

<main>
  <div class="portal-shell">
    <div class="portal-narrow" id="panelWrap" style="max-width:460px;">
      <div class="form-panel">
        <span class="form-no">TUTOR ACCOUNT</span>
        <h3 style="margin-top:6px;" id="panelTitle">Manage your own listing</h3>
        <p style="color:var(--ink-soft); font-size:0.88rem; margin-bottom:20px;" id="panelSub">Manage your rate, description, photo and subjects directly, at any time.</p>

        <div class="auth-tabs">
          <button class="auth-tab active" id="tabLogin">Log in</button>
          <button class="auth-tab" id="tabRegister">Register</button>
        </div>

        <div class="auth-error" id="authError"></div>

        <form id="loginForm" novalidate>
          <div class="field">
            <label for="lPhone">Phone number <span class="req">*</span></label>
            <input type="tel" id="lPhone" required placeholder="10-digit mobile number">
          </div>
          <div class="field">
            <label for="lPassword">Password <span class="req">*</span></label>
            <input type="password" id="lPassword" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Log in</button>
        </form>

        <form id="registerForm" novalidate style="display:none;">
          <p style="color:var(--ink-soft); font-size:0.84rem; margin-bottom:18px;">A coordinator reviews this before your profile goes live on the public directory — fill in what you can now, you can always edit it later.</p>

          <div class="photo-upload">
            <div class="photo-preview" id="photoPreview">?</div>
            <div>
              <div class="file-field" style="text-align:left; padding:10px 14px;">
                <input type="file" id="rPhoto" accept="image/*">
                <span style="font-size:0.76rem;">JPG or PNG. Resized automatically.</span>
              </div>
              <p id="photoStatus" style="font-size:0.78rem; color:var(--ink-soft); margin:6px 0 0;"></p>
            </div>
          </div>

          <div class="field-row">
            <div class="field">
              <label for="rName">Your name <span class="req">*</span></label>
              <input type="text" id="rName" required>
            </div>
            <div class="field">
              <label for="rPhone">Phone number <span class="req">*</span></label>
              <input type="tel" id="rPhone" required placeholder="10-digit mobile number">
            </div>
          </div>

          <div class="field-row">
            <div class="field">
              <label for="rEmail">Email</label>
              <input type="email" id="rEmail">
            </div>
            <div class="field">
              <label for="rPassword">Password <span class="req">*</span></label>
              <input type="password" id="rPassword" required minlength="6">
            </div>
          </div>

          <div class="field">
            <label for="rSubjects">Subjects you teach <span class="req">*</span></label>
            <input type="text" id="rSubjects" required placeholder="e.g. Mathematics, Physics">
          </div>

          <div class="field-row">
            <div class="field">
              <label for="rClasses">Classes</label>
              <input type="text" id="rClasses" placeholder="e.g. 9-12">
            </div>
            <div class="field">
              <label for="rBoards">Boards</label>
              <input type="text" id="rBoards" placeholder="e.g. CBSE, ICSE">
            </div>
          </div>

          <div class="field-row">
            <div class="field">
              <label for="rExams">Exams (if any)</label>
              <input type="text" id="rExams" placeholder="e.g. JEE, NEET">
            </div>
            <div class="field">
              <label for="rExperience">Experience <span class="req">*</span></label>
              <input type="text" id="rExperience" required placeholder="e.g. 5 years">
            </div>
          </div>

          <div class="field">
            <label for="rQualification">Qualification <span class="req">*</span></label>
            <input type="text" id="rQualification" required placeholder="e.g. M.Sc Mathematics, B.Ed">
          </div>

          <div class="field-row">
            <div class="field">
              <label for="rRate">Rate per hour (₹)</label>
              <input type="text" id="rRate" placeholder="e.g. 600">
            </div>
            <div class="field">
              <label for="rMode">Mode <span class="req">*</span></label>
              <select id="rMode" required>
                <option value="">Select mode</option>
                <option>Home visit</option><option>Online</option><option>Either</option>
              </select>
            </div>
          </div>

          <div class="field">
            <label for="rLocality">Area you can cover <span class="req">*</span></label>
            <input type="text" id="rLocality" required placeholder="e.g. South Delhi">
          </div>

          <div class="field">
            <label for="rDescription">Short description</label>
            <textarea id="rDescription" rows="3" placeholder="Your teaching style, notable results, what makes your classes work."></textarea>
          </div>

          <button type="submit" class="btn btn-primary btn-block">Create account</button>
        </form>
      </div>
    </div>
  </div>
</main>

<div id="site-footer-mount"></div>

<script src="js/jt-data.js"></script>
<script src="js/site.js"></script>
<script>
  jtRenderHeader("become-a-tutor.html");
  jtRenderFooter();

  const existing = jtGetSession();
  if (existing && existing.role === "tutor") location.href = "tutor-dashboard.html";

  const tabLogin = document.getElementById("tabLogin");
  const tabRegister = document.getElementById("tabRegister");
  const loginForm = document.getElementById("loginForm");
  const registerForm = document.getElementById("registerForm");
  const errorBox = document.getElementById("authError");
  const panelWrap = document.getElementById("panelWrap");

  function showError(msg) { errorBox.textContent = msg; errorBox.classList.add("show"); }
  function clearError() { errorBox.classList.remove("show"); }

  tabLogin.addEventListener("click", () => {
    tabLogin.classList.add("active"); tabRegister.classList.remove("active");
    loginForm.style.display = ""; registerForm.style.display = "none"; clearError();
    panelWrap.style.maxWidth = "460px";
  });
  tabRegister.addEventListener("click", () => {
    tabRegister.classList.add("active"); tabLogin.classList.remove("active");
    registerForm.style.display = ""; loginForm.style.display = "none"; clearError();
    panelWrap.style.maxWidth = "640px";
  });

  const REASONS = {
    invalid_phone: "Enter a valid 10-digit phone number.",
    weak_password: "Password needs to be at least 6 characters.",
    phone_exists: "An account with this phone number already exists — try logging in instead.",
    invalid_credentials: "That phone number or password doesn't match our records.",
    too_many_attempts: "Too many attempts — please wait 15 minutes and try again.",
    not_configured: "The account system isn't connected yet. See apps-script/README.md.",
    network: "Couldn't reach the server — check your connection and try again."
  };

  loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    clearError();
    const btn = loginForm.querySelector("button");
    btn.disabled = true; btn.textContent = "Logging in…";
    const res = await jtApiCall("login", {
      role: "tutor",
      phone: document.getElementById("lPhone").value,
      password: document.getElementById("lPassword").value
    });
    btn.disabled = false; btn.textContent = "Log in";
    if (res.ok) {
      jtSaveSession(res.token, "tutor");
      location.href = "tutor-dashboard.html";
    } else {
      showError(REASONS[res.reason] || "Something went wrong — please try again.");
    }
  });

  // photo is resized client-side immediately; upload happens after account creation
  let pendingPhotoDataUrl = null;
  document.getElementById("rPhoto").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    const statusEl = document.getElementById("photoStatus");
    if (!file) return;
    statusEl.textContent = "Processing…";
    statusEl.style.color = "var(--ink-soft)";
    try {
      pendingPhotoDataUrl = await jtResizeImageToDataUrl(file);
      const kb = Math.round(pendingPhotoDataUrl.split(",")[1].length * 0.75 / 1024);
      document.getElementById("photoPreview").innerHTML = `<img src="${pendingPhotoDataUrl}" alt="" style="width:100%;height:100%;object-fit:cover;">`;
      statusEl.textContent = `Compressed to ${kb}KB — uploads once your account is created.`;
      statusEl.style.color = "var(--ink-soft)";
    } catch (err) {
      statusEl.textContent = "Couldn't process that image — please try a different file.";
      statusEl.style.color = "var(--stamp)";
      pendingPhotoDataUrl = null;
    }
  });

  registerForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    clearError();
    const btn = registerForm.querySelector("button");
    btn.disabled = true; btn.textContent = "Creating account…";

    const res = await jtApiCall("register", {
      role: "tutor",
      name: document.getElementById("rName").value,
      phone: document.getElementById("rPhone").value,
      email: document.getElementById("rEmail").value,
      password: document.getElementById("rPassword").value,
      subjects: document.getElementById("rSubjects").value,
      classes: document.getElementById("rClasses").value,
      boards: document.getElementById("rBoards").value,
      exams: document.getElementById("rExams").value,
      experience: document.getElementById("rExperience").value,
      qualification: document.getElementById("rQualification").value,
      rate: document.getElementById("rRate").value,
      mode: document.getElementById("rMode").value,
      locality: document.getElementById("rLocality").value,
      description: document.getElementById("rDescription").value
    });

    if (!res.ok) {
      btn.disabled = false; btn.textContent = "Create account";
      showError(REASONS[res.reason] || "Something went wrong — please try again.");
      return;
    }

    jtSaveSession(res.token, "tutor");

    if (pendingPhotoDataUrl) {
      btn.textContent = "Uploading photo…";
      const base64 = pendingPhotoDataUrl.split(",")[1];
      await jtApiCall("uploadPhoto", { token: res.token, photoBase64: base64, mimeType: "image/jpeg" });
    }

    location.href = "tutor-dashboard.html";
  });
</script>
</body>
</html>
