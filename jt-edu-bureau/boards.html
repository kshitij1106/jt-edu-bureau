<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boards — JT Education Bureau</title>
<meta name="description" content="Curriculum boards covered by JT Education Bureau tutors — CBSE, ICSE, IB, state boards and NIOS across Delhi NCR.">
<link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="site-header-mount"></div>

<main>
  <section class="section" style="padding-bottom:20px;">
    <div class="container">
      <div class="section-head">
        <span class="eyebrow">On the registry</span>
        <h1 style="font-size:clamp(1.9rem,3.4vw,2.6rem);">Boards we cover</h1>
        <p class="lede">Our tutors are matched to your child's exact curriculum, not just the subject.</p>
      </div>
    </div>
  </section>

  <section class="section" style="padding-top:0;">
    <div class="container">
      <div class="card-grid" id="listMount"></div>
    </div>
  </section>

  <section class="section section-alt">
    <div class="container">
      <div class="cta-banner">
        <div>
          <h2>Don't see what you need?</h2>
          <p>Tell us directly — our coordinators cover more than what's listed here.</p>
        </div>
        <a href="find-a-tutor.html" class="btn btn-brass">Request a tutor</a>
      </div>
    </div>
  </section>
</main>

<div id="site-footer-mount"></div>

<script src="js/jt-data.js"></script>
<script src="js/site.js"></script>
<script>
  jtRenderHeader("boards.html");
  jtRenderFooter();

  const FALLBACK = [{"Name": "CBSE", "Description": "Central Board of Secondary Education \u2014 all classes.", "Tag": "Most requested"}, {"Name": "ICSE / ISC", "Description": "Council for the Indian School Certificate Examinations.", "Tag": ""}, {"Name": "IB", "Description": "International Baccalaureate \u2014 PYP, MYP and DP.", "Tag": ""}, {"Name": "State boards", "Description": "Delhi, Haryana and UP state curricula.", "Tag": ""}, {"Name": "NIOS", "Description": "National Institute of Open Schooling.", "Tag": ""}];

  (async () => {
    const rows = await jtFetchTab("boards", FALLBACK);
    jtMountCards(document.getElementById("listMount"), rows, { name: "Name", description: "Description", tag: "Tag" }, () => "find-a-tutor.html");
  })();
</script>
</body>
</html>
