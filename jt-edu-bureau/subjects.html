<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subjects — JT Education Bureau</title>
<meta name="description" content="School subjects covered by JT Education Bureau tutors across Delhi NCR, from primary school through Class 12 boards.">
<link rel="icon" type="image/png" href="assets/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="site-header-mount"></div>

<main>
  <section class="section" style="padding-bottom:20px;">
    <div class="container">
      <div class="section-head">
        <span class="eyebrow">On the registry</span>
        <h1 style="font-size:clamp(1.9rem,3.4vw,2.6rem);">Subjects we teach</h1>
        <p class="lede">From primary school fundamentals to Class 12 board preparation. Every subject below has verified tutors on our Delhi NCR registry.</p>
      </div>
    </div>
  </section>

  <section class="section" style="padding-top:0;">
    <div class="container">
      <div class="card-grid" id="listMount"></div>
    </div>
  </section>

  <section class="section section-alt">
    <div class="container">
      <div class="cta-banner">
        <div>
          <h2>Don't see what you need?</h2>
          <p>Tell us directly — our coordinators cover more than what's listed here.</p>
        </div>
        <a href="find-a-tutor.html" class="btn btn-brass">Request a tutor</a>
      </div>
    </div>
  </section>
</main>

<div id="site-footer-mount"></div>

<script src="js/jt-data.js"></script>
<script src="js/site.js"></script>
<script>
  jtRenderHeader("subjects.html");
  jtRenderFooter();

  const FALLBACK = [{"Name": "Mathematics", "Description": "Classes 1\u201312, all major boards.", "Tag": "Core"}, {"Name": "Science", "Description": "Physics, Chemistry, Biology combined, Classes 1\u201310.", "Tag": "Core"}, {"Name": "Physics", "Description": "Classes 9\u201312, board and foundation.", "Tag": "Senior"}, {"Name": "Chemistry", "Description": "Classes 9\u201312, board and foundation.", "Tag": "Senior"}, {"Name": "Biology", "Description": "Classes 9\u201312, board and NEET foundation.", "Tag": "Senior"}, {"Name": "English", "Description": "Grammar, writing and literature.", "Tag": "Core"}, {"Name": "Hindi", "Description": "Grammar, comprehension and writing.", "Tag": "Core"}, {"Name": "Social Science", "Description": "History, Civics, Geography, Economics.", "Tag": "Core"}, {"Name": "Computer Science", "Description": "Coding fundamentals to board exams.", "Tag": "Senior"}, {"Name": "Accountancy", "Description": "Classes 11\u201312, Commerce stream.", "Tag": "Commerce"}, {"Name": "Economics", "Description": "Classes 11\u201312, all boards.", "Tag": "Commerce"}, {"Name": "Business Studies", "Description": "Classes 11\u201312, Commerce stream.", "Tag": "Commerce"}];

  (async () => {
    const rows = await jtFetchTab("subjects", FALLBACK);
    jtMountCards(document.getElementById("listMount"), rows, { name: "Name", description: "Description", tag: "Tag" }, () => "find-a-tutor.html");
  })();
</script>
</body>
</html>
