<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Competitive exams — JT Education Bureau</title>
<meta name="description" content="Foundation and competitive-exam coaching from JT Education Bureau tutors — JEE, NEET, CUET, Olympiads and more across Delhi NCR.">
<link rel="icon" type="image/png" href="assets/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="site-header-mount"></div>

<main>
  <section class="section" style="padding-bottom:20px;">
    <div class="container">
      <div class="section-head">
        <span class="eyebrow">On the registry</span>
        <h1 style="font-size:clamp(1.9rem,3.4vw,2.6rem);">Competitive exam coaching</h1>
        <p class="lede">Tutors experienced in exam-specific coaching, from early foundation years through final revision.</p>
      </div>
    </div>
  </section>

  <section class="section" style="padding-top:0;">
    <div class="container">
      <div class="card-grid" id="listMount"></div>
    </div>
  </section>

  <section class="section section-alt">
    <div class="container">
      <div class="cta-banner">
        <div>
          <h2>Don't see what you need?</h2>
          <p>Tell us directly — our coordinators cover more than what's listed here.</p>
        </div>
        <a href="find-a-tutor.html" class="btn btn-brass">Request a tutor</a>
      </div>
    </div>
  </section>
</main>

<div id="site-footer-mount"></div>

<script src="js/jt-data.js"></script>
<script src="js/site.js"></script>
<script>
  jtRenderHeader("how-it-works.html");
  jtRenderFooter();

  const FALLBACK = [{"Name": "JEE Main & Advanced", "Description": "Engineering entrance, Classes 11\u201312 and droppers.", "Tag": "Competitive"}, {"Name": "NEET", "Description": "Medical entrance, Classes 11\u201312 and droppers.", "Tag": "Competitive"}, {"Name": "BITSAT", "Description": "Undergraduate admissions, BITS Pilani.", "Tag": "Competitive"}, {"Name": "CUET", "Description": "Common University Entrance Test.", "Tag": "Competitive"}, {"Name": "Olympiads", "Description": "Maths, Science and English olympiad prep.", "Tag": "Foundation"}, {"Name": "NDA", "Description": "Defence entrance for Army, Navy and Air Force.", "Tag": "Competitive"}, {"Name": "SAT", "Description": "Undergraduate admissions test, India and abroad.", "Tag": "Study abroad"}, {"Name": "Foundation (8\u201310)", "Description": "Early groundwork for JEE / NEET aspirants.", "Tag": "Foundation"}];

  (async () => {
    const rows = await jtFetchTab("exams", FALLBACK);
    jtMountCards(document.getElementById("listMount"), rows, { name: "Name", description: "Description", tag: "Tag" }, () => "find-a-tutor.html");
  })();
</script>
</body>
</html>
